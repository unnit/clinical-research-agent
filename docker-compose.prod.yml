services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
    # NOTE: no `ports:` block — Qdrant only reachable from inside the network

  app:
    build: .
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      PUBMED_EMAIL: ${PUBMED_EMAIL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      QDRANT_URL: http://qdrant:6333
      LOG_LEVEL: INFO
    # NOTE: no `ports:` block — backend only reachable via frontend container

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"   # only port exposed to the host; host nginx forwards here

volumes:
  qdrant_data:

