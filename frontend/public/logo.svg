<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Connection lines, drawn first so nodes sit on top -->
  <g stroke="#94a3b8" stroke-width="1.4" opacity="0.5" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="5"/>
    <line x1="16" y1="16" x2="25.5" y2="10.5"/>
    <line x1="16" y1="16" x2="25.5" y2="21.5"/>
    <line x1="16" y1="16" x2="16" y2="27"/>
    <line x1="16" y1="16" x2="6.5" y2="21.5"/>
    <line x1="16" y1="16" x2="6.5" y2="10.5"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#94a3b8">
    <circle cx="16" cy="5" r="2.4"/>
    <circle cx="25.5" cy="10.5" r="2.4"/>
    <circle cx="25.5" cy="21.5" r="2.4"/>
    <circle cx="16" cy="27" r="2.4"/>
    <circle cx="6.5" cy="21.5" r="2.4"/>
    <circle cx="6.5" cy="10.5" r="2.4"/>
  </g>

  <!-- Central node, larger and in accent -->
  <circle cx="16" cy="16" r="3.6" fill="#2563eb"/>
</svg>
